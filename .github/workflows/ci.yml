name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real SQL Server for DevVault.IntegrationTests (LocalDB is Windows-only). The container
    # lives for this job only; the password just has to satisfy SQL Server's complexity rules.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: DevVault-ci-${{ github.run_id }}!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7

      # Microsoft's current install script, not actions/setup-dotnet: the copy bundled in setup-dotnet@v6 downloads from
      # a storage account that began refusing public access on 25 Oct 2026 (409 PublicAccessNotPermitted). The current
      # script downloads from builds.dotnet.microsoft.com, but only for an exact version: asked for a channel, it still
      # tries an aka.ms link that leads to the blocked account. So look up the latest 10.0 SDK first (global.json's
      # rollForward allows any 10.0 feature band from its own up).
      - name: Install .NET
        run: |
          curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          version=$(curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json | jq -r '."latest-sdk"')
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$version" --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --version

      - name: Restore
        run: dotnet restore "DevVault.sln"

      - name: Check formatting
        run: dotnet format "DevVault.sln" --verify-no-changes --no-restore

      - name: Build
        run: dotnet build "DevVault.sln" -c Release --no-restore

      - name: Test
        run: dotnet test "DevVault.sln" -c Release --no-build --logger "trx;LogFileName=results.trx"
        env:
          # Read by DevVaultApiFactory; without it the integration tests fall back to LocalDB.
          DEVVAULT_TEST_SQL: Server=localhost,1433;Database=DevVault_IntegrationTests;User Id=sa;Password=DevVault-ci-${{ github.run_id }}!;TrustServerCertificate=True

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
